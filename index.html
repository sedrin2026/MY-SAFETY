<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MY SAFE</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ロック画面アイコンのネオンアニメーション */
    @keyframes neonPulse {
      0%, 100% { text-shadow: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan); }
      50% { text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan), 0 0 30px var(--neon-cyan); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }
    .cyber-lock-icon {
      animation: neonPulse 1.5s infinite alternate;
      position: relative;
      overflow: hidden;
    }
    .cyber-lock-icon::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: rgba(0, 240, 255, 0.3);
      animation: scanline 2s linear infinite;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- ロック画面 -->
    <section id="lockScreen" class="container">
      <div style="text-align: center; padding: 40px 0;">
        <h1 class="brand">MY SAFE</h1>
        <p class="muted">ACCESS CONTROLLED</p>
        <!-- ロックアイコンの配置 (CSSで円形のエフェクトとアニメーションを作る) -->
        <div class="cyber-lock-icon" style="width: 150px; height: 150px; border: 2px solid var(--neon-cyan); border-radius: 50%; margin: 40px auto; display: flex; align-items: center; justify-content: center; font-size: 60px; color: var(--neon-cyan); box-shadow: 0 0 25px rgba(0,240,255,0.4); background: radial-gradient(circle, rgba(0,102,255,0.1) 0%, rgba(5,7,10,0) 70%);">🔐</div>
      </div>

      <div class="card">
        <label>Unlock Vault</label>
        <input type="password" id="masterPassword" class="input-field" placeholder="••••••••">
        <label style="margin-top: 10px; display: block; font-weight: 300; text-transform: none;">
          <input type="checkbox" id="showPasswordCheck"> Show Password
        </label>
        <button id="unlockBtn" class="btn-primary" style="margin-top: 20px;">Authorize</button>
        
        <div style="text-align: center; margin: 20px 0; color: var(--text-muted); font-size: 12px;">--- OR ---</div>
        <button class="secondary" id="passkeyUnlockBtn">🔑 Use Biometrics / PIN</button>
        <div id="passkeyStatus" style="margin-top: 10px; font-size: 11px; text-align: center; color: var(--neon-blue);"></div>
      </div>
      <div id="lockError" class="error"></div>
      <button id="setupBtn" class="hidden" style="margin-top:20px; background:none; border:none; color:var(--neon-magenta); width:100%; text-align:center; cursor:pointer; text-decoration:underline; font-size:12px;">Initialize New Vault</button>
    </section>

    <!-- セットアップ画面 -->
    <section id="setupScreen" class="container hidden">
      <div class="modalCard">
        <div class="modalHead">
          <h2>Initialize Vault</h2>
        </div>
        <label>New Master Password (min 10 chars)</label>
        <input type="password" id="setupPassword" class="input-field">
        <button type="button" id="toggleSetupPassword" class="small" style="margin-bottom:10px;">Show</button>
        
        <label>Confirm Password</label>
        <input type="password" id="setupPassword2" class="input-field">
        <button type="button" id="toggleSetupPassword2" class="small" style="margin-bottom:20px;">Show</button>

        <button id="createVaultBtn" class="btn-primary">Create Secure Vault</button>
        <button id="backLockBtn" class="secondary" style="margin-top:10px;">
