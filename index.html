<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MY SAFE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- 1. ロック解除画面 -->
    <section id="lockScreen" class="container">
      <div style="text-align: center; padding: 25px 0 15px;">
        <h1 class="brand">MY SAFE</h1>
        <p class="muted" style="margin-top: 6px;">あなたの大切な情報を安全に管理</p>
        
        <!-- サイバーロックアイコン装飾 -->
        <div style="width: 130px; height: 130px; border: 2px solid var(--accent-cyan); border-radius: 50%; margin: 25px auto; display: flex; align-items: center; justify-content: center; font-size: 45px; box-shadow: 0 0 25px rgba(0,240,255,0.3); background: radial-gradient(circle, rgba(0,240,255,0.1) 0%, rgba(9,13,22,0) 70%);">🔐</div>
      </div>

      <div class="card">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px; color:var(--accent-cyan); font-weight:600; font-size:14px;">
          <span>🛡️</span> ロック解除
        </div>
        
        <div style="position:relative;">
          <input type="password" id="masterPassword" class="input-field" placeholder="マスターパスワードを入力" style="padding-right:45px;">
          <button type="button" id="togglePw" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:12px;">表示</button>
        </div>

        <label style="margin: 8px 0 16px; display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" id="showPasswordCheck"> パスワードを表示する
        </label>

        <button id="unlockBtn" class="btn-primary">ロック解除</button>
        
        <div style="text-align: center; margin: 16px 0; color: var(--text-muted); font-size: 12px; position:relative;">
          <span style="background:var(--bg-card); padding:0 10px; position:relative; z-index:1;">または</span>
          <div style="position:absolute; top:50%; left:0; right:0; height:1px; background:var(--border-card); z-index:0;"></div>
        </div>

        <button class="btn-secondary" id="passkeyUnlockBtn" style="margin-bottom: 10px;">🔢 PINコードで解除</button>
        <div id="passkeyStatus" style="text-align: center; font-size: 12px; color: var(--text-muted);">
          <span id="passkeyManageBtn" style="cursor:pointer; color:var(--accent-cyan);">🔑 PINコードを設定済み</span>
        </div>
      </div>

      <!-- セキュリティのヒントカード -->
      <div class="card" style="margin-top: 15px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px; color:var(--accent-cyan); font-weight:600; font-size:14px;">
          <span>🛡️</span> セキュリティのヒント
        </div>
        <div class="muted" style="line-height: 1.5;">マスターパスワードとPINコードの併用で、より安全に保護されます。</div>
      </div>

      <div id="lockError" class="error"></div>
      <button id="setupBtn" class="hidden" style="margin-top:10px; background:none; border:none; color:var(--accent-cyan); width:100%; text-align:center; cursor:pointer;">初回設定（金庫作成）はこちら</button>
    </section>

    <!-- 2. 初回セットアップ画面 -->
    <section id="setupScreen" class="container hidden" style="padding-top: 40px;">
      <h1 class="brand">初回セットアップ</h1>
      <p class="muted" style="text-align: center; margin-bottom: 20px;">新しい暗号化金庫を作成します</p>
      <div class="card">
        <label>マスターパスワード（10文字以上）</label>
        <input type="password" id="setupPassword" class="input-field" placeholder="10文字以上のパスワード">
        <button type="button" id="toggleSetupPassword" class="small" style="margin-bottom:10px;">表示する</button>
        
        <label>パスワード（確認用）</label>
        <input type="password" id="setupPassword2" class="input-field" placeholder="もう一度入力">
        <button type="button" id="toggleSetupPassword2" class="small" style="margin-bottom:15px;">表示する</button>

        <button id="createVaultBtn" class="btn-primary">金庫を作成する</button>
        <button id="backLockBtn" class="btn-secondary" style="margin-top:10px;">戻る</button>
        <div id="setupError" class="error"></div>
      </div>
    </section>

    <!-- 3. メイン画面（ロック解除後ホーム） -->
    <section id="vaultScreen" class="container" style="display:none; padding-top:15px;">
      <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 class="brand" style="margin:0; font-size: 22px; text-align: left;">MY SAFE</h1>
        <div style="display:flex; gap: 15px; font-size: 18px; cursor: pointer;">
          <span title="検索">🔍</span>
          <span id="lockBtn" title="ロックする">⚙️</span>
        </div>
      </header>

      <div style="display: flex; gap: 12px; margin-bottom: 20px;">
        <div class="card" style="flex: 1; margin:0; padding:14px; text-align:center; cursor:pointer;">
          <div style="font-size:22px; margin-bottom:4px;">🔢</div>
          <div style="font-weight:bold; font-size:13px;">PINコード認証</div>
          <div class="muted" style="font-size:11px;">クイックアクセス</div>
        </div>
        <div class="card" style="flex: 1; margin:0; padding:14px; text-align:center; cursor:pointer;" onclick="document.getElementById('lockBtn').click()">
          <div style="font-size:22px; margin-bottom:4px;">🔒</div>
          <div style="font-weight:bold; font-size:13px;">ロックする</div>
          <div class="muted" style="font-size:11px;">手動でロック</div>
        </div>
      </div>

      <!-- カテゴリタブ -->
      <div class="tabs" style="margin-bottom: 20px;">
        <button class="tab active" data-category="all">すべて</button>
        <button class="tab" data-category="アプリ">📱 アプリ</button>
        <button class="tab" data-category="銀行">🏦 銀行</button>
        <button class="tab" data-category="カード">💳 カード</button>
      </div>

      <!-- 閲覧回数カード -->
      <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <div style="display:flex; align-items:center; gap:6px; font-weight:bold; margin-bottom:4px;">
            <span style="color:var(--accent-cyan);">🛡️</span> 本日の閲覧回数
          </div>
          <div class="muted" style="font-size:11px;">最終閲覧: 2026/08/15 04:26:03</div>
        </div>
        <div style="font-size: 22px; font-weight: 800; color: #fff;">4回</div>
      </div>

      <!-- 登録データ一覧エリア -->
      <div id="categoryLabel" style="font-size: 13px; color: var(--text-muted); margin: 20px 0 10px; font-weight: 600;">すべて</div>
      <div id="entryList"></div>

      <!-- 新規登録フローティングボタン -->
      <button id="addBtn" class="btn-primary" style="position:fixed; right:20px; bottom:75px; width:auto; border-radius:999px; padding:12px 24px; box-shadow:0 6px 20px rgba(0,81,255,0.5); z-index:90; font-weight:700;">
        ＋ 新規登録
      </button>
    </section>

    <!-- 4. 新規登録・編集画面 -->
    <section id="editorScreen" class="container hidden" style="padding-top:15px;">
      <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <button id="closeEditorBtn" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">←</button>
        <h2 id="editorTitle" style="margin:0; font-size:18px; font-weight:700;">新規登録</h2>
        <button id="saveEntryBtn" style="background:none; border:none; color:var(--accent-cyan); font-weight:700; cursor:pointer; font-size:15px;">保存</button>
      </header>

      <div class="card">
        <label>カテゴリ</label>
        <select id="f_category" class="input-field">
          <option value="アプリ">アプリ</option>
          <option value="銀行">銀行</option>
          <option value="カード">カード</option>
          <option value="その他">その他</option>
        </select>

        <label>アプリ名 / サービス名</label>
        <input type="text" id="f_appName" class="input-field" placeholder="例) Amazon、Google">

        <label>ログインID</label>
        <input type="text" id="f_loginId" class="input-field" placeholder="例) user@example.com">

        <label>パスワード</label>
        <div style="position:relative;">
          <input type="password" id="f_password" class="input-field" placeholder="パスワードを入力" style="padding-right:60px;">
          <button type="button" id="togglePw" class="small" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); padding:6px 10px;">表示</button>
        </div>

        <label>登録メールアドレス</label>
        <input type="text" id="f_email" class="input-field" placeholder="例) user@example.com">

        <label>メモ（任意）</label>
        <textarea id="f_memo" class="input-field" placeholder="メモを入力" rows="2" style="resize:none;"></textarea>

        <!-- 既存JS互換用の隠しフィールド（削除・エラー防止用） -->
        <div class="hidden">
          <input type="text" id="f_phone">
          <input type="text" id="f_address">
          <input type="text" id="f_holder">
          <input type="text" id="f_accountName">
          <input type="text" id="f_cardNumber">
          <input type="text" id="f_expiry">
          <input type="text" id="f_cvv">
        </div>

        <button id="saveEntryBtn_bottom" class="btn-primary" style="margin-top:10px;" onclick="document.getElementById('saveEntryBtn').click()">保存</button>
        <button id="deleteEntryBtn" class="danger hidden" style="margin-top:10px;">削除</button>
      </div>
    </section>

    <!-- ボトムナビゲーションバー -->
    <nav class="bottom-nav">
      <button class="nav-item active">
        <div>🏠</div>
        <div>ホーム</div>
      </button>
      <button class="nav-item">
        <div>🕒</div>
        <div>履歴</div>
      </button>
      <button class="nav-item">
        <div>🛡️</div>
        <div>セキュリティ</div>
      </button>
      <button class="nav-item">
        <div>⚙️</div>
        <div>設定</div>
      </button>
    </nav>

  </div>

  <!-- スクリプトファイルの読み込み（機能・ロジック完全維持） -->
  <script src="app.js"></script>
  <script src="ui-layer.js"></script>
</body>
</html>
