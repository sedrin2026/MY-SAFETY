<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="端末内だけで使う暗号化パスワード管理PWA">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <title>MY SAFE</title>
</head>
<body>
  <main id="app" class="app">
    <!-- ロック画面 -->
    <section id="lockScreen" class="screen">
      <div class="brand">🔐 MY SAFE</div>
      <p id="lockMessage" class="muted" style="margin-bottom: 24px;">自分専用の暗号化セーフ</p>
      
      <div style="width: 100%; max-width: 360px;">
        <input id="masterPassword" class="input" type="password" autocomplete="current-password"
               placeholder="マスターパスワードを入力" enterkeyhint="go">
        <button id="unlockBtn" class="primary">ロック解除</button>
        <button id="passkeyUnlockBtn" class="secondary hidden" type="button">🔑 パスキーで解除</button>
        <button id="setupBtn" class="secondary hidden">初回設定へ</button>
        <p id="passkeyStatus" class="tiny" style="margin-top: 12px;"></p>
        <p id="lockError" class="error"></p>
      </div>
    </section>

    <!-- 初回設定画面 -->
    <section id="setupScreen" class="screen hidden">
      <div class="brand">🔐 MY SAFE</div>
      <h1>初回設定</h1>
      <p class="muted" style="text-align: center; margin-bottom: 20px;">このパスワードは保存されません。忘れると復元できません。</p>
      
      <div style="width: 100%; max-width: 360px;">
        <input id="setupPassword" class="input" type="password" autocomplete="new-password" placeholder="マスターパスワード (10文字以上)">
        <input id="setupPassword2" class="input" type="password" autocomplete="new-password" placeholder="もう一度入力">
        <button id="createVaultBtn" class="primary">金庫を作成</button>
        <button id="backLockBtn" class="secondary">戻る</button>
        <p id="setupError" class="error"></p>
      </div>
    </section>

    <!-- メイン金庫画面 -->
    <section id="vaultScreen" class="hidden">
      <header class="topbar">
        <div>
          <strong>🔐 MY SAFE</strong>
          <span id="categoryLabel" class="muted">すべて</span>
        </div>
        <div class="topbar-actions">
          <button id="passkeyManageBtn" class="small" type="button">🔑 パスキー</button>
          <button id="lockBtn" class="small">🔒 ロック</button>
        </div>
      </header>

      <nav class="tabs">
        <button class="tab active" data-category="all">すべて</button>
        <button class="tab" data-category="アプリ">📱 アプリ</button>
        <button class="tab" data-category="銀行">🏦 銀行</button>
        <button class="tab" data-category="カード">💳 カード</button>
      </nav>

      <section id="viewHistory" class="view-history" aria-label="閲覧履歴">
        <div class="view-history-main">
          <span class="view-history-title">🔓 本日の閲覧回数</span>
          <strong id="todayViewCount">0回</strong>
        </div>
        <div id="lastViewedAt" class="view-history-last">最終閲覧：—</div>
        <button id="viewHistoryBtn" class="small" type="button" style="margin-top: 4px;">履歴を見る</button>
      </section>

      <section id="viewHistoryList" class="view-history-list hidden">
        <div class="view-history-list-head">
          <strong>📋 閲覧履歴</strong>
          <button id="closeHistoryBtn" class="small" type="button">閉じる</button>
        </div>
        <div id="historyItems"></div>
      </section>

      <section id="entryList" class="entries"></section>

      <button id="addBtn" class="fab">＋ 新規登録</button>
    </section>

    <!-- エディターモーダル -->
    <section id="editorScreen" class="modal hidden">
      <div class="modalCard">
        <div class="modalHead">
          <h2 id="editorTitle">新規登録</h2>
          <button id="closeEditorBtn" class="small">✕</button>
        </div>

        <label>カテゴリ
          <select id="f_category" class="input">
            <option>アプリ</option>
            <option>銀行</option>
            <option>カード</option>
          </select>
        </label>

        <div id="commonFields">
          <label>アプリ名 / サービス名<input id="f_appName" class="input" autocomplete="off" placeholder="例) Amazon, Google"></label>
          <label>ログインID<input id="f_loginId" class="input" autocomplete="off" placeholder="例) user@example.com"></label>
          <label>パスワード
            <div class="pwrow">
              <input id="f_password" class="input" type="password" autocomplete="off" placeholder="パスワードを入力">
              <button id="togglePw" class="small" style="height: 48px; margin-top: 7px;">表示</button>
            </div>
          </label>
          <label>登録メアド<input id="f_email" class="input" type="email" autocomplete="off"></label>
          <label>登録電話番号<input id="f_phone" class="input" autocomplete="off"></label>
          <label>登録住所<input id="f_address" class="input" autocomplete="off"></label>
          <label>登録者名<input id="f_holder" class="input" autocomplete="off"></label>
          <label>アカウント名<input id="f_accountName" class="input" autocomplete="off"></label>
          <label>カード番号<input id="f_cardNumber" class="input" inputmode="numeric" autocomplete="off"></label>
          <label>有効期限<input id="f_expiry" class="input" placeholder="MM/YY" autocomplete="off"></label>
          <label>CVV<input id="f_cvv" class="input" type="password" inputmode="numeric" autocomplete="off"></label>
        </div>

        <div class="actions">
          <button id="saveEntryBtn" class="primary">保存</button>
          <button id="deleteEntryBtn" class="danger hidden">削除</button>
        </div>
        <p class="tiny">※端末内保存のみ。実データ投入前に必ずダミーデータでテストしてください。</p>
      </div>
    </section>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
